<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a Stones Prayer Board</title>
  <meta name="description" content="Open an invite-only Prayer Board in Stones." />
  <style>
    :root { color-scheme: light; --bg: #f9f2ea; --surface: #fefcf9; --ink: #352c25; --soft: #6b5a4d; --line: #ece2d3; --accent: #b85f3c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(120% 60% at 50% -10%, #fbeee2, transparent 60%), var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: 0 18px 50px rgba(60,42,24,.08); text-align: center; }
    .mark { color: var(--accent); font-size: 36px; }
    h1 { margin: 14px 0 10px; font-family: Georgia, serif; font-size: 30px; }
    p { color: var(--soft); line-height: 1.6; }
    a.button { display: block; margin-top: 22px; padding: 14px 18px; border-radius: 999px; background: var(--accent); color: white; font-weight: 700; text-decoration: none; }
    a.store { display: inline-block; margin-top: 18px; color: var(--accent); }
    .privacy { margin-top: 24px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◌</div>
    <h1>You’re invited to pray together</h1>
    <p>Prayer Boards are small, invite-only spaces in Stones. Sign in and choose whether to join before any shared prayers are shown.</p>
    <a class="button" id="open-app" href="https://apps.apple.com/app/id6777986871">Open in Stones</a>
    <a class="store" href="https://apps.apple.com/app/id6777986871">Get Stones from the App Store</a>
    <p class="privacy">Invitation links contain no prayer words and expire after seven days.</p>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (token && token.length >= 16 && token.length <= 200) {
      document.getElementById('open-app').href = `stones://boards/join?token=${encodeURIComponent(token)}`;
    }
  </script>
</body>
</html>
